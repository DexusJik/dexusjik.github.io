name: checks

# Runs the validators on every push and on PRs. This is the point of moving the
# tools into the repo: before this, nothing stopped a regression landing.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: validators
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: install dependencies
        # There are none by design. `npm ci` would fail without a lockfile, so
        # this is just an assertion that the runner is sane.
        run: node --version

      - name: run validators
        run: npm test

  contrast:
    name: measured contrast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Chrome is preinstalled on ubuntu-latest, so nothing needs installing.
      # The probe finds it itself via CHROME_PATH or its own search list, and
      # exits 2 with a clear message if it genuinely cannot, rather than
      # silently passing.
      - name: report which browser the probe will use
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          echo "candidate: ${CHROME:-none found on PATH}"
          if [ -n "$CHROME" ]; then
            echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
            "$CHROME" --version
          fi

      # This is the contrast gate. It replaced a static check that compared ~35
      # token pairs chosen by hand, which could not see a rule painting text
      # with a raw palette step instead of a token. That blind spot let 19
      # dark-mode elements land below AA while every static gate was green.
      #
      # If no browser is found the step FAILS rather than passing quietly. A
      # contrast gate that silently stops running is exactly the failure mode
      # this whole exercise was about.
      - name: measured contrast, every screen and viewport
        run: node tools/probe-contrast-browser.js

  icons:
    name: icon derivatives
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: install Pillow
        run: pip install --quiet pillow

      # Fails if a derivative is missing or has grown past the size budget, so
      # the next person cannot quietly point the favicon back at the 372 KB
      # portrait photo.
      - name: check icon derivatives
        run: python tools/gen-icons.py --check

  hygiene:
    name: repo hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: no CRLF committed
        run: |
          if git ls-files -z | xargs -0 file 2>/dev/null | grep -q 'CRLF'; then
            echo '::error::files committed with CRLF line endings; .gitattributes should prevent this'
            git ls-files -z | xargs -0 file | grep 'CRLF'
            exit 1
          fi
          echo 'line endings clean'

      - name: no secret-looking strings
        run: |
          # The patterns are built by concatenation on purpose. Written
          # literally, this workflow file matches its own scan, which is how the
          # first version of this job failed: grep found the pattern inside the
          # very command doing the grepping.
          #
          #   sk_live  = 'sk' + '_live_'
          #   pk_live  = 'pk' + '_live_'
          #   ghp      = 'gh' + 'p_'
          #   github_pat = 'github' + '_pat_'
          #   AKIA     = 'AKI' + 'A'
          #   PEM      = 'BEGIN ' + 'PRIVATE KEY'
          PATTERNS="sk${D}_live_|pk${D}_live_|gh${D}p_[A-Za-z0-9]{20,}|github${D}_pat_|AKI${D}A[0-9A-Z]{16}|-----BEGIN ${D}[A-Z ]*PRIVATE KEY"
          PATTERNS="${PATTERNS//$D/}"
          # tools/check-secret-scan.js needs no exclusion: it holds its example
          # credentials as two halves joined at run time, so no contiguous
          # secret-shaped string exists in it for this scan (or GitHub push
          # protection) to find. It is the gate proving this scan still works.
          if grep -rInE "$PATTERNS" \
               --include='*.js' --include='*.html' --include='*.css' \
               --include='*.json' --include='*.yml' \
               --exclude-dir=node_modules --exclude-dir=.git \
               . ; then
            echo '::error::a credential-shaped string is committed'
            exit 1
          fi
          echo 'no credentials found'

      - name: every local asset reference resolves
        run: |
          # This is tools/check-asset-refs.js, which also runs inside `npm test`
          # above. It is repeated here only to name the failure clearly.
          echo 'covered by the validators job via check-asset-refs'